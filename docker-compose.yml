# Runs the whole of MiniDesk on your computer with one command:
#   docker compose up --build
# Then open http://localhost:8080
#
# Copy .env.example to .env in this folder first, and fill it in.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: minidesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # Keeps the data when the container is removed or rebuilt.
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minidesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 5000
      # Containers find each other by service name, so the database's address is "db".
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: minidesk
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLIENT_ORIGIN: http://localhost:8080
    ports:
      - "5000:5000"
    depends_on:
      db:
        # Waits until PostgreSQL accepts connections, not just until its container starts.
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # The browser calls the API directly, so this is your computer's address, not "api".
        VITE_API_URL: http://localhost:5000/api
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
