server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Built files have a content fingerprint in their names, so they can be cached for a year.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
  }

  # Any other address gets index.html, and React Router shows the right page.
  # Without this, refreshing /tickets/1006 would give a 404.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
  }
}
